<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KinderGuide Ottawa</title>
<meta name="description" content="Find licensed child care in Ottawa in 4 clear steps: find, shortlist, visit, apply. Every official service in one place.">
<meta name="theme-color" content="#0b5c66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="KinderGuide Ottawa: find child care in 4 clear steps">
<meta property="og:description" content="Every licensed program and every official City of Ottawa and Ontario service in one place, with Public Health inspection results. A University of Ottawa student project.">
<meta property="og:image" content="https://aridjmetatla-max.github.io/kinderguide-ottawa/og.jpg">
<meta property="og:url" content="https://aridjmetatla-max.github.io/kinderguide-ottawa/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='36' rx='26' ry='24' fill='%23f6c453'/%3E%3Ccircle cx='23' cy='32' r='4' fill='%232b2b2b'/%3E%3Ccircle cx='41' cy='32' r='4' fill='%232b2b2b'/%3E%3Cpath d='M24 44 Q32 50 40 44' stroke='%232b2b2b' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css?v=40">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

<header class="top glass">
  <a class="brand" href="#home" data-view="home" aria-label="KinderGuide Ottawa, home">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#0b5c66"/><path d="M9 19.5 20 10l11 9.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 17.5V30h15V17.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/><path d="M20 27.2s-4-2.4-4-5a2.2 2.2 0 0 1 4-1.3 2.2 2.2 0 0 1 4 1.3c0 2.6-4 5-4 5z" fill="#f4b740"/></svg></span>
    <span class="brand-text"><b>KinderGuide</b> <em data-i18n="brandSub">Ottawa</em><small data-i18n="brandTag">Child care, step by step</small></span>
  </a>
  <nav class="stepper" aria-label="Steps" id="stepper"></nav>
  <div class="top-actions">
    <button class="pill" data-view="services" id="svcBtn"><span class="ico-slot" data-ic="grid"></span><span data-i18n="services">All services</span></button>
    <button class="pill help-top" id="helpTop" aria-label="Help"><span class="ico-slot" data-ic="help"></span></button>
    <button class="pill lang" id="langBtn" lang="fr"><span class="ico-slot" data-ic="globe"></span><span id="langLbl">Français</span><span class="lang-short" id="langShort">FR</span></button>
  </div>
</header>

<main id="main" tabindex="-1">
  <!-- HOME -->
  <section class="view" id="view-home" aria-labelledby="homeTitle">
    <div class="hero">
      <div class="hero-text">
        <h1 id="homeTitle" data-i18n="heroTitle">Find child care in Ottawa, in 4 clear steps.</h1>
        <p class="lead" data-i18n="heroLead"></p>
        <form class="quick glass" id="quick">
          <div class="field"><span class="flabel" data-i18n="myChild">My child is</span><div class="chips" id="ageChips"></div></div>
          <div class="field"><span class="flabel" data-i18n="near">Near</span>
            <div class="near-row"><input id="postalInput" class="input" autocomplete="postal-code" aria-label="Postal code"><button type="button" class="btn ghost" id="locateBtn"><span class="ico-slot" data-ic="locate"></span><span data-i18n="useLoc">Use my location</span></button></div>
            <p class="hint" id="nearStatus" aria-live="polite"></p>
          </div>
          <details class="dates" id="datesBox"><summary><span class="ico-slot" data-ic="calendar"></span><span data-i18n="datesQ">Need care later, or baby not born yet?</span></summary>
            <div class="dates-row"><label><span data-i18n="birthL">Birth or due date</span><input type="date" id="birthInput" class="input"></label><label><span data-i18n="needL">Care needed from</span><input type="date" id="needInput" class="input"></label></div>
            <p class="hint" id="datesHint" aria-live="polite"></p>
          </details>
          <button class="btn primary big" type="submit"><span data-i18n="showPrograms">Show programs</span> →</button>
        </form>
      </div>
      <div class="hero-side">
        <div class="steps4" id="steps4"></div>
        <div class="stats glass" id="stats"></div>
      </div>
    </div>
    <section class="band" aria-labelledby="svcBandTitle">
      <div class="band-head"><div><h2 id="svcBandTitle" data-i18n="servicesTitle"></h2><p data-i18n="servicesLead"></p></div><button class="btn ghost" data-view="services"><span data-i18n="seeAll">See all services</span> →</button></div>
      <div class="svc-row" id="svcRow"></div>
    </section>
    <p class="trust" data-i18n="trust"></p>
  </section>

  <!-- 1 FIND -->
  <section class="view" id="view-find" aria-labelledby="findTitle">
    <div class="find-bar glass">
      <h1 class="sr" id="findTitle" data-i18n="step1">Find</h1>
      <label class="sel"><span class="sr" data-i18n="myChild"></span><select id="fAge"></select></label>
      <div class="loc" id="locBox"></div>
      <div class="seg" id="fRadius" role="group" aria-label="Distance"></div>
      <label class="search"><span class="sr" data-i18n="search"></span><input id="fQuery" type="search" class="input" autocomplete="off"></label>
      <button class="btn ghost" id="filterBtn" aria-expanded="false" aria-controls="filterPop"><span class="ico-slot" data-ic="filter"></span><span data-i18n="filters">Filters</span> <b class="fcount" id="fCount" hidden></b></button>
      <div class="pop glass" id="filterPop" hidden></div>
    </div>
    <div class="find">
      <div class="list-col">
        <div class="list-head"><span id="resultCount" aria-live="polite"></span><button class="link" id="kipFind" data-kip="find"><span data-i18n="help">Help</span></button></div>
        <div id="tipBox"></div>
        <div class="list" id="results"></div>
      </div>
      <div class="map-col glass"><div id="map" role="region" aria-label="Map of licensed child care"></div>
        <div class="legend" id="legend"></div></div>
    </div>
    <div class="next-bar" id="nextFind"></div>
  </section>

  <!-- 2 SHORTLIST -->
  <section class="view" id="view-shortlist" aria-labelledby="slTitle">
    <div class="page-head"><div><p class="eyebrow" id="slEyebrow"></p><h1 id="slTitle" data-i18n="slTitle"></h1><p data-i18n="slLead"></p></div>
      <div class="seg" id="slMode" role="group"></div></div>
    <div id="sharedBanner"></div>
    <div class="slots glass" id="slProgress"></div>
    <div id="slBody"></div>
    <div class="actions" id="slActions"></div>
    <div class="next-bar" id="nextShortlist"></div>
  </section>

  <!-- 3 VISIT -->
  <section class="view" id="view-visit" aria-labelledby="vTitle">
    <div class="page-head"><div><p class="eyebrow" id="vEyebrow"></p><h1 id="vTitle" data-i18n="vTitle"></h1><p data-i18n="vLead"></p></div>
      <div class="seg" id="clMode" role="group"></div></div>
    <div class="chips scroller" id="clFor" role="group"></div>
    <div class="visit-grid">
      <div id="clGroups"></div>
      <aside class="visit-side">
        <div class="glass card-pad" id="clScore"></div>
        <div class="glass card-pad" id="clRatio"></div>
        <div class="glass card-pad"><h3 data-i18n="lookFor"></h3><ul class="ticks" id="lookFor"></ul></div>
        <div class="glass card-pad" id="visitCal"></div>
      </aside>
    </div>
    <div class="next-bar" id="nextVisit"></div>
  </section>

  <!-- 4 APPLY -->
  <section class="view" id="view-apply" aria-labelledby="aTitle">
    <div class="page-head"><div><p class="eyebrow" id="aEyebrow"></p><h1 id="aTitle" data-i18n="aTitle"></h1><p data-i18n="aLead"></p></div>
      <div class="ring" id="planRing"></div></div>
    <div class="apply-grid">
      <ol class="tasks" id="tasks"></ol>
      <aside class="apply-side"><div class="glass card-pad" id="timeline"></div><div class="glass card-pad est" id="estimator"></div>
        <button class="btn primary big wide" id="printPlan"><span class="ico-slot" data-ic="printer"></span><span data-i18n="printPlan">Print my child care plan</span></button></aside>
    </div>
  </section>

  <!-- SERVICES HUB -->
  <section class="view" id="view-services" aria-labelledby="svcTitle">
    <div class="page-head"><div><h1 id="svcTitle" data-i18n="svcTitle"></h1><p data-i18n="svcLead"></p></div></div>
    <label class="search big-search glass"><span class="ico-slot" data-ic="search"></span><span class="sr" data-i18n="svcSearch"></span><input id="svcQuery" type="search" autocomplete="off"></label>
    <div id="svcGroups"></div>
    <section class="faq" aria-labelledby="faqTitle"><h2 id="faqTitle"><span data-i18n="faqTitle">Questions and answers</span></h2><p data-i18n="faqLead"></p><div id="faqList"></div></section>
  </section>

  <!-- DATA INSIGHTS FOR THE CITY -->
  <section class="view" id="view-insights" aria-labelledby="insTitle">
    <div class="page-head"><div><p class="eyebrow" data-i18n="insEyebrow"></p><h1 id="insTitle" data-i18n="insTitle"></h1><p data-i18n="insLead"></p></div></div>
    <div id="insights"></div>
  </section>

  <!-- ABOUT -->
  <section class="view" id="view-about" aria-labelledby="aboutTitle">
    <div class="page-head"><div><h1 id="aboutTitle" data-i18n="aboutTitle"></h1></div></div>
    <div id="about"></div>
  </section>
</main>

<footer class="foot">
  <span>KinderGuide Ottawa · SED3111 · <span data-i18n="trust"></span></span>
  <span class="foot-links"><button class="link" data-view="about" data-i18n="footerAbout"></button> · <button class="link" data-view="insights" data-i18n="footerInsights"></button> · <button class="link" id="tourAgain" data-i18n="footerTour"></button> · <a class="link" href="prototype-1/" data-i18n="footerP1"></a></span>
</footer>

<!-- Mobile bottom navigation -->
<nav class="bottom glass" id="bottomNav" aria-label="Steps (mobile)"></nav>

<!-- Details panel -->
<div class="scrim" id="scrim" hidden></div>
<aside class="panel glass" id="panel" aria-hidden="true" role="dialog" aria-labelledby="pTitle"></aside>

<!-- Kip helper -->
<button class="kip-fab" id="kipFab" aria-label="Help" aria-expanded="false"><span class="ico-slot" data-ic="help"></span><span data-i18n="help">Help</span></button>
<div class="kip-bubble glass" id="kipBubble" hidden role="status"></div>

<!-- Tour -->
<div class="tour" id="tour" hidden>
  <div class="tour-card glass" role="dialog" aria-labelledby="tourTitle">
    <svg class="kip" viewBox="0 0 120 120" aria-hidden="true">
      <ellipse cx="60" cy="70" rx="44" ry="40" fill="#f6c453"/>
      <circle cx="44" cy="62" r="7" fill="#2b2b2b"/><circle cx="76" cy="62" r="7" fill="#2b2b2b"/>
      <circle cx="46" cy="60" r="2.2" fill="#fff"/><circle cx="78" cy="60" r="2.2" fill="#fff"/>
      <path d="M48 82 Q60 92 72 82" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="36" cy="78" r="6" fill="#f08a6b" opacity=".6"/><circle cx="84" cy="78" r="6" fill="#f08a6b" opacity=".6"/>
      <path d="M60 30 Q62 14 74 12" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="76" cy="11" r="6" fill="#e07a5f"/>
    </svg>
    <h2 id="tourTitle"></h2>
    <p id="tourText"></p>
    <div class="tour-dots" id="tourDots"></div>
    <div class="tour-actions"><button class="btn ghost" id="tourSkip"></button><button class="btn primary" id="tourNext"></button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<section id="planPrint" aria-hidden="true"></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js?v=40"></script>
<script src="icons.js?v=40"></script>
<script src="data/providers.js?v=40"></script>
<script src="data/inspections.js?v=40"></script>
<script src="content.js?v=40"></script>
<script src="app.js?v=40"></script>
</body>
</html>
